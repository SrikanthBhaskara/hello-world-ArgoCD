apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ares
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-ares-creds
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: aws-ares-creds
            namespace: external-secrets
            key: secret-access-key
          sessionTokenSecretRef:
            name: aws-ares-creds
            namespace: external-secrets
            key: session-token
