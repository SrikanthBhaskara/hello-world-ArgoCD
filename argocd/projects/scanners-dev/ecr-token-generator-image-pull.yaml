apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: bitdefender-image-pull-ecr-token
  namespace: mars
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  region: us-west-2
  auth:
    secretRef:
      accessKeyIDSecretRef:
        name: aws-ares-creds
        namespace: mars
        key: access-key
      secretAccessKeySecretRef:
        name: aws-ares-creds
        namespace: mars
        key: secret-access-key
      sessionTokenSecretRef:
        name: aws-ares-creds
        namespace: mars
        key: session-token
