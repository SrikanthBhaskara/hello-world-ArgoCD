apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bitdefender-ecr-helm-repo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 30m
  target:
    name: bitdefender-ecr-helm-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: helm
        name: bitdefender-ecr
        url: 776389595347.dkr.ecr.us-west-2.amazonaws.com
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
        expiresAt: "{{ .expires_at }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: bitdefender-ecr-token
