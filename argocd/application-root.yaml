apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitdefender-scanner-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrikanthBhaskara/hello-world-ArgoCD.git
    targetRevision: main
    path: argocd/projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
